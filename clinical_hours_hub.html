<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Hours Tracking</title>
    <style>
        :root { 
            --ui-blue: #00558C; 
            --ui-gold: #FFCD00; 
            --bg: #f8fafc; 
            --text: #1e293b; 
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 0; line-height: 1.6; 
        }

        header { 
            background-color: #ffffff; 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom: 8px solid var(--ui-gold); 
        }

        .header-logo { max-width: 120px; height: auto; margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 2rem; color: var(--ui-blue); }
        
        .nav-back {
            display: inline-block; margin-top: 15px;
            color: var(--ui-blue); text-decoration: none;
            font-weight: 600; font-size: 0.9rem;
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 30px; 
        }

        .patient-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100%; 
        }

        .patient-thumb {
            width: 100%; height: 180px;
            background-color: #e2e8f0;
            object-fit: cover;
            border-bottom: 4px solid var(--ui-gold);
        }

        .card-content { 
            padding: 20px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
        }

        .patient-name { font-size: 1.2rem; font-weight: 700; color: var(--ui-blue); margin-bottom: 8px; }
        .patient-desc { font-size: 0.95rem; color: #64748b; margin-bottom: 15px; }

        .section-label {
            font-size: 0.75rem; font-weight: 800; color: var(--ui-blue);
            text-transform: uppercase; letter-spacing: 0.05em;
            margin-bottom: 8px; display: block;
        }

        .audio-container {
            margin: 15px 0; background: #f1f5f9; 
            padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1;
        }

        audio { width: 100%; height: 35px; }

        .checklist {
            margin: 15px 0; padding: 15px;
            background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;
        }

        .checklist label { display: block; margin-bottom: 5px; font-size: 0.9rem; cursor: pointer; color: var(--text); }

        .feedback-mark {
            display: inline-block;
            width: 20px;
            font-weight: bold;
            margin-right: 5px;
        }

        .clinical-input-area { margin: 15px 0; }

        textarea {
            width: 100%; height: 80px;
            border: 1px solid #cbd5e1; border-radius: 4px;
            padding: 10px; font-family: inherit; font-size: 0.85rem;
            resize: none; box-sizing: border-box;
            display: block;
        }

        .submit-btn {
            width: 100%; background: var(--ui-blue); color: white;
            border: none; padding: 12px; border-radius: 4px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
            margin-top: auto; 
        }

        .submit-btn:hover { background: #003d66; }

        details {
            margin: 15px 0; border: 2px solid var(--ui-blue); 
            padding: 12px; border-radius: 8px; background-color: #f0f7ff;
        }

        .input-group-centered {
            text-align: center;
        }
        
        .input-group-centered .nurse-name {
            display: block;
            margin: 0 auto; /* Centers the block-level input */
            max-width: 90%; /* Prevents it from hitting the card edges too hard */
        }
        
        summary { font-weight: 800; cursor: pointer; color: var(--ui-blue); }

        footer { text-align: center; padding: 60px 20px; color: #94a3b8; }
    </style>
</head>
<body>

<header>
    <img src="./images/CIL_logo.png" alt="CIL Logo" class="header-logo">
    <h1>Clinical Hours Tracking</h1>
    <a href="index.html" class="nav-back">← Back to Lab Home</a>
</header>


<footer>&copy; 2026 University of Iowa College of Nursing</footer>
</body>
</html>
